<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Patinhas Caiçara: doação de cães, gatos e outros animais no litoral do Paraná, com cadastro de microchip.">
<meta name="theme-color" content="#0b4f5c">
<title>Patinhas Caiçara</title>
<script>
  // aplica o tema salvo antes de desenhar a página (evita piscar)
  try {
    var t = localStorage.getItem('pc-tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
    document.documentElement.dataset.tema = t;
  } catch (e) { document.documentElement.dataset.tema = 'claro'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topo" id="topo">
  <div class="wrap barra">
    <a class="logo" href="#inicio" aria-label="Patinhas Caiçara, início">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="#0b4f5c"/>
        <path d="M4 32c5-3 9-3 14 0s9 3 14 0 9-3 12 0v6a22 22 0 0 1-40 0z" fill="#127a86"/>
        <ellipse cx="24" cy="25" rx="6.5" ry="5.5" fill="#ef6f53"/>
        <circle class="dedo" cx="15.5" cy="18" r="3" fill="#ef6f53"/><circle class="dedo" cx="21" cy="13.5" r="3" fill="#ef6f53" style="animation-delay:.05s"/>
        <circle class="dedo" cx="27" cy="13.5" r="3" fill="#ef6f53" style="animation-delay:.1s"/><circle class="dedo" cx="32.5" cy="18" r="3" fill="#ef6f53" style="animation-delay:.15s"/>
      </svg>
      <span>Patinhas Caiçara</span>
    </a>
    <nav class="menu" aria-label="Principal">
      <a class="lnk" href="#inicio" data-nav="inicio">Adotar</a>
      <a class="lnk" href="#anunciar" data-nav="anunciar">Doar um animal</a>
      <a class="lnk" href="#microchip" data-nav="microchip">Microchip</a>
      <a class="lnk" href="#chat" data-nav="chat">Conversas</a>
      <button class="icone-btn" id="btn-som" aria-label="Desligar sons" title="Sons">🔊</button>
      <button class="icone-btn" id="btn-tema" aria-label="Alternar tema claro/escuro" title="Tema">
        <svg class="sol-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="#entrar" id="btn-conta" class="conta sem-login">Entrar</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<nav class="abas-baixo" aria-label="Atalhos">
  <a href="#inicio" data-nav="inicio"><span>🏠</span>Adotar</a>

  <a href="#perfil" data-nav="perfil"><span>👤</span>Perfil</a>
</nav>

<footer>
  <div class="wrap"><span class="pata">🐾</span> Patinhas Caiçara · adoção responsável no litoral do Paraná<br>
  Antonina · Guaraqueçaba · Guaratuba · Matinhos · Morretes · Paranaguá · Pontal do Paraná</div>
</footer>
